# Local services for Chronos: the Chronos PostgreSQL (source master and, later, the DataSentinel
# metrics store and the tables the dashboards read) and Airflow 3.4.0.
#
# The Airflow part is adapted from Airflow's official quick start file
# (https://airflow.apache.org/docs/apache-airflow/3.4.0/docker-compose.yaml). Changes from it,
# each recorded in docs/decisions.md:
#   - LocalExecutor instead of CeleryExecutor, so no Redis, Celery worker or Flower. Runs are
#     serial (max_active_runs = 1), so distributing tasks over workers buys nothing on a laptop.
#   - The image is the Python 3.11 variant of 3.4.0, matching Glue 5.1 and the local venv. The
#     image's providers, Amazon included, are pinned by Airflow's constraints for that tag.
#   - Example DAGs are off, and config and plugins live under airflow_local/.
#
# Usage: docker compose up -d   (Airflow UI on http://localhost:8080, user airflow / airflow)
# Local-development credentials only. Override them in a .env file (see .env.example).

x-airflow-common:
  &airflow-common
  image: apache/airflow:3.4.0-python3.11
  env_file:
    - path: .env
      required: false
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./airflow_local/config:/opt/airflow/config
    - ./airflow_local/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

services:
  # The project's own database. Kept apart from Airflow's metadata database because it plays
  # an operational source system; Airflow's bookkeeping doesn't belong in it.
  chronos-db:
    image: postgres:16.16
    environment:
      POSTGRES_USER: ${CHRONOS_DB_USER:-chronos}
      POSTGRES_PASSWORD: ${CHRONOS_DB_PASSWORD:-chronos}
      POSTGRES_DB: chronos
    ports:
      # 5433 on the host, so it can't clash with a PostgreSQL already installed on the laptop.
      - "5433:5432"
    volumes:
      - chronos-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${CHRONOS_DB_USER:-chronos}", "-d", "chronos"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-db:
    image: postgres:16.16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-off: migrates the metadata database, creates the admin user and the shared folders.
  # Trimmed from the quick start's version, which also prints resource warnings.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  # For running airflow CLI commands: docker compose run --rm airflow-cli <command>
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  chronos-db-volume:
  airflow-db-volume:
