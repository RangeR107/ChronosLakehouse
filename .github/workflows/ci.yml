name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # The same PostgreSQL image as docker-compose.yml, so the source-database tests run in CI
    # instead of being skipped. Free on GitHub-hosted runners.
    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # Same versions as Glue 5.1 and the local setup: Python 3.11, Java 17 for Spark 3.5.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The Iceberg smoke test downloads the iceberg-spark-runtime jar from Maven Central on
      # first use, so this step needs network access.
      - name: Test
        run: pytest
        env:
          # CI has a database, so a PostgreSQL test that skips here means something is broken.
          CHRONOS_REQUIRE_POSTGRES: "1"
