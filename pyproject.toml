[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos"
version = "0.0.1"
description = "Batch lakehouse that replays Olist orders as a late, messy event feed and publishes only audited releases."
# Python 3.11 matches AWS Glue 5.1, so code tested here runs there unchanged.
requires-python = ">=3.11,<3.12"
# Exact pins: the spec pins PySpark to Glue 5.1's Spark 3.5.6. psycopg matches the version
# Airflow 3.4.0's constraints install, so the Phase 2 Airflow image needs no second copy.
dependencies = [
    "pyspark==3.5.6",
    "psycopg[binary]==3.3.6",
    # DataSentinel's rule checks (spec: DataSentinel, "Tooling"). 1.24.1 rather than 1.25.0,
    # which was 11 days old. It brings pandas with it; ruff below keeps pipeline code from
    # importing pandas directly.
    "great-expectations==1.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    # The truth test's reference build is written in DuckDB SQL, so it shares no code with the
    # pipeline it checks (spec: Testing and evaluation).
    "duckdb==2.0.0",
]
# The Streamlit dashboard. It pulls in pandas, so it stays out of the pipeline's dependencies.
dashboard = [
    "streamlit==1.67.0",
]
# Only for the reference scripts in tools/, at the versions their numbers were measured with.
# Kept out of the core dependencies so pipeline code can't come to rely on pandas by accident.
tools = [
    "pandas==3.1.1",
    "numpy==2.4.6",
]

[tool.setuptools.packages.find]
# Only the pipeline's own code is a package. tests/ and tools/ are run in place, and dags/ is
# loaded by Airflow from its folder, not imported.
include = ["generator*", "jobs*", "sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "postgres: needs a reachable PostgreSQL (skipped otherwise; CHRONOS_REQUIRE_POSTGRES=1 fails instead)",
    "olist: needs the Olist CSVs in data/raw/olist (skipped otherwise; CHRONOS_REQUIRE_OLIST=1 fails instead)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ holds the reference scripts whose output the spec quotes. They are kept exactly as they
# were measured with, so lint changes can't alter a reference number.
extend-exclude = ["tools"]

[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# pandas arrives with Great Expectations, but the pipeline runs on Spark: a pandas DataFrame
# would pull a whole table onto one machine. The dashboard, which reads small aggregates, may.
"pandas".msg = "Pipeline code uses Spark, not pandas (pyproject.toml)."

[tool.ruff.lint.per-file-ignores]
"dashboard/*" = ["TID251"]
# The DataSentinel console is a Streamlit page like the dashboard, not pipeline code.
"sentinel/console/*" = ["TID251"]
